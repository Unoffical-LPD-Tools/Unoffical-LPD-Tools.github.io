<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="style.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
    .small-timer { /* Example size! */
        zoom: 0.70;
        background-color: #1e1f22;
        color: white;
        text-align: center;
    }
    body{
        background-color: #1e1f22;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: "Roboto", sans-serif;
        font-weight: 500;
        font-style: normal;
        overflow: hidden;
    }
    .button{
        width: 40vw;
    }
    .bc{
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>


<script src="timer.js"></script>
</head>

<body>
<div class="small-timer">
    <div class="bc">
        <span>Planning Time:&nbsp</span>
        <span id="PlanTime">Unset</span>
        <button style="background-color: #ED4245; height: 2.5em; width: 2.5em; font-size: .5em; margin: 1em;" class="button" type="button" onclick='ResetTimer("PlancountDown")'>X</button>
    </div>
    <div class="bc">
        <span>Maximum Time:&nbsp</span>
        <span id="MaxTime">Unset</span>
        <button style="background-color: #ED4245; height: 2.5em; width: 2.5em; font-size: .5em; margin: 1em;" class="button" type="button" onclick='ResetTimer("MaxcountDown");ResetTimer("MincountDown")'>X</button>
    </div>
    <div class="bc">
        <span>Minimum Time:&nbsp</span>
        <span id="MinTime">Unset</span>
    </div>
    <button style="padding: .2em; font-size: 1.2em;" class="button" type="button" onclick="PlanTimer()">Plan</button>
    <button style="padding: .2em; font-size: 1.2em;" class="button" type="button" onclick="PlanAddTime(2)">+2</button>
    <button style="padding: .2em; font-size: 1.2em;" class="button" type="button" onclick="StartTimer()">Start</button>
</div>
</body>
