  <div id="ansi">

      <span class="hljs-ansi-foreground-yellow" style="font-family: inherit; font-weight: inherit; font-style: inherit; font-size: 14px; vertical-align: baseline; color: rgb(181, 137, 0)">%FGGold%</span>  <span class="hljs-ansi-foreground-blue" style="font-family: inherit; font-weight: inherit; font-style: inherit; font-size: 14px; vertical-align: baseline; color: rgb(38, 139, 210)">%FGBlue%</span>  <span class="hljs-ansi-foreground-magenta" style="font-family: inherit; font-weight: inherit; font-style: inherit; font-size: 14px; vertical-align: baseline; color: rgb(211, 54, 130)">%FGPink%</span>

    </div>
    <script>
      function ansicheck(){
      if (!localStorage['Template'].match(/\`\`\`ansi/i)){
        document.getElementById('ansi').style.display = 'none';
      }else{document.getElementById('ansi').style.display = 'block';}}
      ansicheck()
    </script>

<script>
  document.getElementById("Template").value = localStorage['Template'];
    function submitForm() {
      const form = document.getElementById('TemplateForm');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        // Perform validation and processing here
      });
  
      console.log(form.Template.value);


      let Template = form.Template.value;

      localStorage['Template'] = Template;


      document.getElementById("Template").value = localStorage['Template'];
      ansicheck()
    }
</script>
